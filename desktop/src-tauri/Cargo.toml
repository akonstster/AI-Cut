[package]
name = "aicut-desktop"
version = "2.2.0"
edition = "2021"
description = "AI-Cut desktop application with a built-in local editor server and MCP endpoint"
authors = ["Andrey Konstantinov"]

[lib]
name = "aicut_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vs-server = { path = "../../crates/vs-server" }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
